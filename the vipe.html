<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العد التنازلي</title>
    <style>
      body {
        font-family: sans-serif;
        background: linear-gradient(to left, rgb(94, 62, 62), rgb(179, 23, 18));
        color: #333;
        text-align: center;
        padding: 120px 20px;
      }

      .container {
        background: white;
        max-width: 400px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      h1 {
        color: #ff6b6b;
      }

      .timer {
        font-size: 2rem;
        font-weight: bold;
        margin: 20px 0;
        color: #5e00f5;
      }
    </style>
</head>
<body>

  <div class="container">
    <h1>☀️ عد تنازلي للصيف</h1>
    <p>باقي :</p>
    <div class="timer" id="timer">جاري التحميل...</div>
  </div>

  <script>
    const targetDate = new Date("June 15, 2027 00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("timer").innerHTML = "🎉 بدأت الإجازة!";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML = 
        `${days} يوم - ${hours} ساعة - ${minutes} دقيقة - ${seconds} ثانية`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
