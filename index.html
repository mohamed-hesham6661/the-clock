<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العد التنازلي لإجازة الصيف</title>
    <style>
      body {
        font-family: Tahoma, sans-serif;
        background: linear-gradient(to left, #1e3c72, #2a5298);
        color: #333;
        text-align: center;
        padding: 60px 20px;
      }

      .container {
        background: white;
        max-width: 420px;
        margin: 0 auto;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      h1 {
        color: #ff7675;
      }

      .timer {
        font-size: 1.8rem;
        font-weight: bold;
        margin: 20px 0;
        color: #5e00f5;
      }

      .vibes-btn {
        background-color: #ff7675;
        color: white;
        border: none;
        padding: 10px 18px;
        font-size: 0.95rem;
        border-radius: 20px;
        cursor: pointer;
        margin: 15px 0 10px;
      }

      .vibes-btn:hover {
        background-color: #d63031;
      }

      .quote-box {
        margin-top: 8px;
        font-style: italic;
        color: #555;
        font-size: 0.9rem;
        min-height: 24px;
      }

      .todo-section {
        margin-top: 25px;
        border-top: 2px dashed #eee;
        padding-top: 15px;
        text-align: right;
      }

      .todo-section h3 {
        margin-bottom: 10px;
        font-size: 1.1rem;
        color: #2a5298;
      }

      .todo-input-wrap {
        display: flex;
        gap: 5px;
      }

      .todo-input-wrap input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: Tahoma, sans-serif;
      }

      .todo-input-wrap button {
        background: #2a5298;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
      }

      .todo-list {
        list-style: none;
        padding: 0;
        margin-top: 10px;
      }

      .todo-list li {
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 0.95rem;
      }

      .mode-toggle {
        margin-top: 20px;
        background: #f1f2f6;
        border: 1px solid #ddd;
        padding: 6px 12px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 0.85rem;
      }
    </style>
</head>
<body>

  <div class="container">
    <h1>☀️ عد تنازلي لإجازة الصيف 🌴</h1>
    <p>باقي :</p>
    <div class="timer" id="timer">جاري التحميل...</div>

    <button class="vibes-btn" onclick="showVibe()">خد جرعة حماس </button>
    <div class="quote-box" id="quoteBox"></div>

    <div class="todo-section">
      <h3>خطة الصيف دي </h3>
      <div class="todo-input-wrap">
        <input type="text" id="todoInput" placeholder="عايز تعمل ايه في الصيف؟">
        <button onclick="addTodo()">إضافة</button>
      </div>
      <ul class="todo-list" id="todoList">
        <li>🌊 نسافر البحر</li>
      </ul>
    </div>

    <button class="mode-toggle" onclick="toggleNight()"> مود بليل</button>
  </div>

  <script>
    const targetDate = new Date("June 15, 2027 00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("timer").innerHTML = "🎉 بدأت الإجازة!";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML = 
        `${days} يوم - ${hours} ساعة - ${minutes} دقيقة - ${seconds} ثانية`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    const vibes = [
      "مفاضلش كتير هانت خلاص!",
      "جهّز المايوه و الشنطة ",
      "أيام الامتحانات هتعدي خلاص ",
      "نوم لحد الضهر قادم لا محالة "
    ];

    function showVibe() {
      const random = vibes[Math.floor(Math.random() * vibes.length)];
      document.getElementById("quoteBox").innerText = random;
    }

    function addTodo() {
      const input = document.getElementById("todoInput");
      if (input.value.trim() !== "") {
        const li = document.createElement("li");
        li.innerText = " " + input.value;
        document.getElementById("todoList").appendChild(li);
        input.value = "";
      }
    }

    let isNight = false;
    function toggleNight() {
      isNight = !isNight;
      if (isNight) {
        document.body.style.background = "linear-gradient(to left, #0f2027, #203a43, #2c5364)";
      } else {
        document.body.style.background = "linear-gradient(to left, #1e3c72, #2a5298)";
      }
    }
  </script>

</body>
</html>
